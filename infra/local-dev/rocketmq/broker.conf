# RocketMQ 5 Broker 配置（本地开发）
#
# brokerIP1 = 127.0.0.1
#   宿主机（IDE / Java 应用）经 namesrv 拿到路由后直连 127.0.0.1:10911，
#   docker 端口映射转发进容器，本地单机场景最简单可靠。
#   若改用 gRPC 客户端（proxy），需把此处改为容器可解析的地址
#   （如 OrbStack 的 liganex-rocketmq-broker.orb.local），详见 docs/dev-setup.md。
#
# 注意：RocketMQ 5.x 已将 4.x 的 mapedFileSizeCommitLog / mapedFileSizeConsumeQueue
# 更名为 mappedFileSize*，继续使用旧属性名会导致 Broker 启动失败
# （表现为 ScheduleMessageService.configFilePath NullPointerException）。
# 这里不显式设置文件大小，使用镜像默认值。

brokerClusterName = LiganexCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
listenPort = 10911

# 存储策略
deleteWhen = 04
fileReservedTime = 72

# 刷盘与复制（本地开发：异步即可）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 开发便利：允许自动创建 topic / 订阅组
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
