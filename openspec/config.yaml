schema: spec-driven

context: |
  Project: Liganex — Agent 应用生态的连接层，以跨境 ERP 为场景（订单/商品/库存数据流）。
  Stack: Java 11+ / Spring Boot 2.3.x (MCP server & hub), React/Vue (frontend), Maven or Gradle.
  Protocol: MCP 2026-07-28 stateless core — no initialize handshake, no Mcp-Session-Id, single POST
            endpoint; required headers MCP-Protocol-Version / Mcp-Method / Mcp-Name; tool annotations;
            inputSchema; structuredContent (MCP Apps); server/discover.
  Conventions:
    - 仓库统一 liganex- 前缀；前端置于业务仓的 frontend/ 目录，不单独建仓。
    - 关键架构决策写入 docs/adr/，对应约束进入 openspec/specs/ 作为可验证事实来源。
    - 安全采用轻量授权：单一 API Key + 工具白名单 + 全量审计日志 + 演示只读副本；不做 OAuth 2.1。
    - spec 使用 RFC 2119 关键词（SHALL/MUST/SHOULD），场景使用 GIVEN/WHEN/THEN。
    - 主仓为 monorepo 入口，业务模块拆为独立 GitHub 仓库（详见 README 仓库清单）。

rules:
  proposal:
    - 必须包含 Non-goals 段
    - 说明本变更与 docs/adr 中对应 ADR 的关系
  tasks:
    - 单条任务工作量不超过 2 小时
    - 每个实现类 change 必须包含验证任务（至少含 `openspec validate`）
