schema: spec-driven

context: |
  Project: Liganex — 面向跨境 ERP 的 Agent 应用生态平台。两层产品面：
  (1) 基础设施层 — MCP server、开放平台 hub、客户端 studio、skill、AI自动化/可观测/沙箱；
  (2) 应用层 — 面向 B 端客户的 AI 生成应用（文生文/文生文/文生图/图生图/图生视频），可消费 ERP 数据作为生成上下文。
  Stack: Java（最低 21，优先 LTS 内最新稳定版）/ Spring Boot 3.x（LTS 内最新稳定版） (MCP server & hub), React/Vue (frontend), Maven or Gradle.
  Protocol: MCP 2026-07-28 stateless core — no initialize handshake, no Mcp-Session-Id, single POST
            endpoint; required headers MCP-Protocol-Version / Mcp-Method / Mcp-Name; tool annotations;
            inputSchema; structuredContent (MCP Apps); server/discover.
  Conventions:
    - 仓库统一 liganex- 前缀；前端置于业务仓的 frontend/ 目录，不单独建仓。
    - 前后端工程分离：业务仓内 frontend/ 与 backend/ 为独立构建、独立部署、可不同技术栈的工程（工程级解耦），但同仓以集中 star（对齐 Dify/Coze Studio 惯例）。
    - AI 生成能力统一经模型供应商抽象层接入（首期 Volcengine 方舟/Seedream/即梦，预留 OpenAI 等），避免绑定单一厂商。
    - B 端应用面需具备按客户用量/配额控制（成本控制），与基础设施层的轻量授权（ADR-0002）边界不同。
    - 关键架构决策写入 docs/adr/，对应约束进入 openspec/specs/ 作为可验证事实来源。
    - 安全采用轻量授权：单一 API Key + 工具白名单 + 全量审计日志 + 演示只读副本；不做 OAuth 2.1。
    - spec 使用 RFC 2119 关键词（SHALL/MUST/SHOULD），场景使用 GIVEN/WHEN/THEN。
    - 项目文档中凡需标注作者/决策人信息，统一使用 "Linda"（区分于 git 提交作者 lindadev77，后者为 GitHub 账号，保持不变）。
    - 主仓为 monorepo 入口，业务模块拆为独立 GitHub 仓库（详见 README 仓库清单）。
    - Schema 变更用 Flyway 版本化迁移管理（见 ADR-0005）：每次结构变更新增增量 SQL 文件（V__），不回改历史、不手改 CREATE TABLE；禁用 ORM 自动建表（ddl-auto）作为 schema 真相源，Flyway 与 MyBatis-Plus 分工（DDL vs DML）。
    - 依赖与技术选型原则：前后端用到的框架与组件，原则上在长期支持（LTS）的稳定版本中选择最新的；JDK 最低版本 21（Java 21 LTS 及以上，优先选用 LTS 内最新稳定版，如 Java 21/25 LTS），不主动采用非 LTS 的短期版本。
    - 稳定与探索的平衡：在 LTS 基线保障核心链路稳定的前提下，允许在受控范围内尝试更新的特性与实验性技术（如新 SDK、新中间件、新 AI 能力）。实验性依赖须隔离在独立模块或特性开关之后，经 agent-dev-loop 沙箱或非生产环境验证，不得进入核心链路、不得破坏 baseline 兼容性，且须通过 OpenSpec change 走评审，而非直接修改 baseline。

rules:
  proposal:
    - 必须包含 Non-goals 段
    - 说明本变更与 docs/adr 中对应 ADR 的关系
  tasks:
    - 单条任务工作量不超过 2 小时
    - 每个实现类 change 必须包含验证任务（至少含 `openspec validate`）
